<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b88b5b">
  <meta name="description" content="TheDupe — premium bags. Browse the collection and inquire via WhatsApp.">
  <title>TheDupe</title>
  <style>
    /* ============ 全局样式规范（PRD §11） ============ */
    :root {
      --color-primary: #b88b5b;      /* 金色 */
      --color-whatsapp: #25D366;     /* WhatsApp 绿 */
      --color-bg: #f8f9fa;           /* 背景色 */
      --color-card: #ffffff;         /* 卡片背景 */
      --color-text: #1a1a1a;         /* 主文字 */
      --color-text-secondary: #888;  /* 次级文字 */
      --radius-card: 16px;           /* 卡片圆角 */
      --radius-button: 60px;         /* 按钮圆角 */
      --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      line-height: 1.5;
    }

    button {
      font-family: inherit;
      border: none;
      background: none;
      cursor: pointer;
      color: inherit;
    }

    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    /* ============ 顶部导航栏（PRD §9）：sticky 固定 + 最大 480px 居中 ============ */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid #eee;
    }

    .navbar-inner {
      max-width: 480px;
      margin: 0 auto;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 56px;
      height: 36px;
      padding: 0 10px;
      border-radius: 18px;
      color: var(--color-text);
      font-size: 14px;
      text-decoration: none;
    }

    .nav-back {
      justify-content: flex-start;
      font-size: 28px;
      line-height: 1;
      padding-left: 4px;
    }

    .nav-logo {
      color: inherit;
      text-decoration: none;
      cursor: pointer;
      flex: 1;
      text-align: center;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-chat {
      justify-content: flex-end;
      color: var(--color-whatsapp);
      font-weight: 600;
    }

    .nav-chat .chat-icon {
      font-size: 17px;
    }

    .hidden {
      display: none !important;
    }

    /* ============ 页面容器：最大宽度 480px 居中 ============ */
    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: calc(100vh - 56px);
      padding: 16px 16px 48px;
    }

    /* ============ 页面切换动画：fadeUp 0.3s（PRD §10） ============ */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .app-page {
      animation: fadeUp 0.3s ease-out both;
    }

    /* ============ 卡片通用：按压缩放 0.96（PRD §10） ============ */
    .card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:active {
      transform: scale(0.96);
    }

    /* ============ 首页（PRD §7） ============ */
    .hero {
      text-align: center;
      padding: 24px 8px 20px;
    }

    .hero-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .hero-sub {
      margin-top: 6px;
      font-size: 14px;
      color: var(--color-text-secondary);
    }

    .section {
      margin-top: 22px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .category-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .category-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 22px 12px;
      background: var(--color-card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      text-align: center;
    }

    .category-icon {
      font-size: 34px;
      line-height: 1.2;
    }

    .category-icon-img {
      width: 64px;
      height: 56px;
      object-fit: contain;
      margin-bottom: 2px;
    }

    .category-name {
      font-size: 15px;
      font-weight: 600;
    }

    .category-count {
      font-size: 12px;
      color: var(--color-text-secondary);
    }

    /* 分类下方引导文案：联系 WhatsApp 查看更多款式 */
    .more-styles {
      margin-top: 22px;
      padding: 16px 18px;
      background: var(--color-card);
      border: 1px dashed #e2c9a8;
      border-radius: var(--radius-card);
      text-align: center;
      box-shadow: var(--shadow-card);
    }

    .more-styles-text {
      font-size: 14px;
      color: var(--color-text);
      line-height: 1.7;
    }

    .more-styles-link {
      color: var(--color-whatsapp);
      font-weight: 700;
      text-decoration: none;
      border-bottom: 2px solid rgba(37, 211, 102, 0.35);
    }

    /* 买家秀：横向滚动，隐藏滚动条 */
    .testimonial-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 2px 2px 8px;
      scrollbar-width: none;
    }

    .testimonial-scroll::-webkit-scrollbar {
      display: none;
    }

    .testimonial-card {
      flex: 0 0 auto;
      width: 140px;
      background: var(--color-card);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow-card);
      scroll-snap-align: start;
    }

    .testimonial-img {
      width: 140px;
      aspect-ratio: 473 / 1024;
      object-fit: cover;
      display: block;
      background: #f2f2f2;
    }

    .testimonial-card figcaption {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--color-text-secondary);
      text-align: center;
    }

    /* ============ 产品列表页（PRD §8） ============ */
    .page-header {
      padding: 4px 2px 14px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 800;
    }

    .page-count {
      margin-top: 2px;
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .product-card {
      background: var(--color-card);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .product-thumb {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #f2f2f2;
    }

    .product-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.25s ease;
    }

    .product-card:active .product-thumb img {
      transform: scale(1.04);
    }

    .product-name {
      display: block;
      padding: 10px 12px 12px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
    }

    /* ============ 产品详情页（PRD §6） ============ */
    .carousel {
      margin: -4px 0 16px;
    }

    .carousel-viewport {
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow-card);
    }

    .carousel-main {
      width: 100%;
      height: 400px;
      max-height: 460px;
      object-fit: contain;
      display: block;
      background: #fff;
    }

    .zoomable {
      cursor: zoom-in;
    }

    @keyframes fadeIn {
      from {
        opacity: 0.15;
      }
      to {
        opacity: 1;
      }
    }

    .carousel-fade {
      animation: fadeIn 0.25s ease both;
    }

    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.85);
      color: var(--color-text);
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
    }

    .carousel-arrow.prev {
      left: 10px;
    }

    .carousel-arrow.next {
      right: 10px;
    }

    .carousel-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 7px;
      row-gap: 6px;
      padding: 0 16px;
      margin-top: 12px;
    }

    .carousel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d9d9d9;
      padding: 0;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .carousel-dot.active {
      background: var(--color-primary);
      transform: scale(1.25);
    }

    .detail-body {
      padding: 0 2px;
    }

    .detail-name {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a1a;
      line-height: 1.3;
    }

    .detail-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid #f0f0f0;
    }

    .detail-sku {
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .detail-inquire {
      background: var(--color-primary);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 60px;
    }

    .detail-desc {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.7;
      color: #555;
    }

    .detail-specs {
      margin-top: 16px;
      border-top: 1px solid #f0f0f0;
    }

    .spec-row {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 12px;
      padding: 11px 2px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .spec-label {
      color: var(--color-text-secondary);
    }

    .spec-value {
      color: #333;
      font-weight: 500;
    }

    .wa-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 22px;
      width: 100%;
      padding: 15px 20px;
      background: var(--color-whatsapp);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      border-radius: var(--radius-button);
      box-shadow: 0 6px 18px rgba(37, 211, 102, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .wa-btn:active {
      transform: scale(0.96);
    }

    /* ============ 图片放大 Lightbox ============ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.92);
      padding: 20px;
    }

    .lightbox img {
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
    }

    .lightbox-close {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 24px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 30px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lightbox-arrow.prev {
      left: 8px;
    }

    .lightbox-arrow.next {
      right: 8px;
    }

    .lightbox-caption {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      font-size: 13px;
      padding: 0 24px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ============ 骨架屏（PRD §10）：6 个灰色方块脉冲动画 ============ */
    .skeleton-page {
      padding-top: 4px;
    }

    .skeleton-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .skeleton-card {
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-card);
      background: linear-gradient(90deg, #ececec 25%, #f6f6f6 37%, #ececec 63%);
      background-size: 400% 100%;
      animation: shimmer 1.3s ease infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: -100% 0;
      }
    }

    /* ============ 错误 / 空状态 ============ */
    .error-page,
    .empty-page {
      text-align: center;
      padding: 60px 20px;
    }

    .state-icon {
      font-size: 44px;
    }

    .state-title {
      margin-top: 12px;
      font-size: 16px;
      font-weight: 700;
    }

    .state-message {
      margin-top: 6px;
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    .state-btn {
      margin-top: 18px;
      padding: 11px 34px;
      background: var(--color-primary);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-button);
    }

    /* ============ 桌面端观感：内容保持 480px 居中 ============ */
    @media (min-width: 520px) {
      body {
        background: #ececec;
      }
      .app {
        background: var(--color-bg);
        box-shadow: 0 0 24px rgba(0, 0, 0, 0.05);
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航栏：在 HTML 中硬编码，不随页面切换重新渲染（PRD §9） -->
  <nav class="navbar">
    <div class="navbar-inner">
      <button id="backBtn" class="nav-btn nav-back hidden" aria-label="Back">‹</button>
      <a id="siteLogo" class="nav-logo" href="#home" aria-label="Back to home">TheDupe</a>
      <a id="chatLink" class="nav-btn nav-chat" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
        <span class="chat-icon">💬</span><span>Chat</span>
      </a>
    </div>
  </nav>

  <!-- 页面渲染容器：所有页面内容由 app.js 注入 -->
  <main id="app" class="app"></main>

  <!-- 图片放大层（Lightbox）：点击图片全屏查看 -->
  <div id="lightbox" class="lightbox hidden" aria-hidden="true">
    <button type="button" id="lightboxClose" class="lightbox-close" aria-label="Close">×</button>
    <button type="button" id="lightboxPrev" class="lightbox-arrow prev hidden" aria-label="Previous image">‹</button>
    <img id="lightboxImg" alt="Enlarged image">
    <button type="button" id="lightboxNext" class="lightbox-arrow next hidden" aria-label="Next image">›</button>
    <div id="lightboxCaption" class="lightbox-caption"></div>
  </div>

  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
